name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: 1h-agent-linux-x86_64
          - os: windows-latest
            artifact: 1h-agent-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh "${{ matrix.artifact }}" ../1H-Agent-Release
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Name "${{ matrix.artifact }}" -OutputDir ../1H-Agent-Release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ../1H-Agent-Release/*

  installers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build deb
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - name: Build msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          cargo wix init
          cargo wix --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            target/debian/*.deb
            target/wix/*.msi
