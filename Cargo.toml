[package]
name = "protium-tui"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, permission-aware TUI agent for Linux, macOS, and Windows"
authors = ["olu"]
license-file = "LICENSE"

[[bin]]
name = "1h-agent-tui"
path = "src/main.rs"

# Compatibility alias for the historical binary name.
[[bin]]
name = "1h-agent"
path = "src/main.rs"

[dependencies]
protium-core = { workspace = true }
anyhow = { workspace = true }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64 = "0.22"
clap = { workspace = true }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = { workspace = true }
ignore = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = "0.2"
unicode-segmentation = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Enables the shared conformance corpus (scenarios + stream invariants) so the
# TUI replay tests consume the exact same fixtures the core asserts against.
protium-core = { workspace = true, features = ["test-util"] }

[workspace]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, permission-aware multi-interface agent for Linux, macOS, and Windows"
authors = ["olu"]
license-file = "LICENSE"
repository = "https://github.com/olu-py/1H-Agent"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
html2text = "0.15"
ignore = "0.4"
keyring = { version = "3", default-features = false }
libc = "0.2"
pulldown-cmark = "0.13"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "io-util", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
protium-core = { git = "https://github.com/olu-py/1H-Agent-core.git", branch = "main" }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "1h-agent"
maintainer = "1H-Agent contributors"
section = "utils"
priority = "optional"
assets = [
  ["target/release/1h-agent", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/1h-agent/README.md", "644"],
  ["THIRD_PARTY_NOTICES.md", "usr/share/doc/1h-agent/THIRD_PARTY_NOTICES.md", "644"],
  ["config/config.example.toml", "usr/share/doc/1h-agent/config.example.toml", "644"],
]

[package.metadata.wix]
eula = false
