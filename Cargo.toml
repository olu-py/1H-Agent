[package]
name = "one-hour-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, permission-aware TUI agent for Linux, macOS, and Windows"
license-file = "LICENSE"

[[bin]]
name = "1h-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
html2text = "0.15"
ignore = "0.4"
keyring = { version = "3", default-features = false }
libc = "0.2"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "io-util", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
name = "1h-agent"
maintainer = "1H-Agent contributors"
section = "utils"
priority = "optional"
assets = [
  ["target/release/1h-agent", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/1h-agent/README.md", "644"],
  ["config/config.example.toml", "usr/share/doc/1h-agent/config.example.toml", "644"],
]
